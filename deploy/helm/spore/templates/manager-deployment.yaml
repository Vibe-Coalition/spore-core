{{- if .Values.manager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spore.managerFullname" . }}
  labels:
    {{- include "spore.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      {{- include "spore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        {{- include "spore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.managerImage.repository }}:{{ .Values.managerImage.tag }}"
          imagePullPolicy: {{ .Values.managerImage.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.manager.port }}
              protocol: TCP
          env:
            - name: MANAGER_PORT
              value: {{ .Values.manager.port | quote }}
            - name: MANAGER_USER
              value: {{ .Values.manager.credentials.user | quote }}
            - name: MANAGER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: MANAGER_PASS
                  optional: true
            - name: MANAGER_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: MANAGER_SERVICE_KEY
                  optional: true
          livenessProbe:
            httpGet:
              path: /api/auth/check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/auth/check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spore.managerFullname" . }}
  labels:
    {{- include "spore.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.manager.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "spore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: manager
{{- end }}
