# Production Docker Compose — pull the official image from ghcr.io.
#
# Usage:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
#
# Persistence: spore.json and .env are written by the first-run wizard
# into /data, so the named volume below is the only state you need to
# back up. No bind mount of /app/spore.json or /app/.env is required.

networks:
  spore-web:
    driver: bridge

services:
  spore:
    image: "${SPORE_IMAGE:-ghcr.io/vibe-coalition/spore-core}:${SPORE_IMAGE_TAG:-latest}"
    container_name: "${SPORE_AGENT_ID:-spore}"
    restart: unless-stopped
    networks:
      - spore-web
    ports:
      - "${SPORE_WEB_PORT:-18803}:${SPORE_WEB_PORT:-18803}"
      - "127.0.0.1:${SPORE_HEALTH_PORT:-18790}:${SPORE_HEALTH_PORT:-18790}"
    environment:
      AGENT_ID: "${SPORE_AGENT_ID:-spore}"
      SPORE_DISPLAY_NAME: "${SPORE_DISPLAY_NAME:-}"
      SPORE_WEB_PORT: "${SPORE_WEB_PORT:-18803}"
      SPORE_HEALTH_PORT: "${SPORE_HEALTH_PORT:-18790}"
      GRAPH_DB_PATH: "/data/graph.db"
      SESSION_DB_PATH: "/data/sessions.db"
      SPORE_DATA_DIR: "/data"
      SPORE_WORKSPACE_PATH: "/workspace"
      # Optional manager / multi-spore mesh
      MANAGER_URL: "${MANAGER_URL:-}"
      MANAGER_SERVICE_KEY: "${MANAGER_SERVICE_KEY:-}"
      # Optional headless-boot pre-seeds. Uncomment in .env.prod if you
      # want to skip the wizard. Leaving these blank means the wizard
      # collects them on first launch and persists into /data.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      DISCORD_TOKEN: "${DISCORD_TOKEN:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
      SLACK_APP_TOKEN: "${SLACK_APP_TOKEN:-}"
    volumes:
      - spore-data:/data
      - spore-workspace:/workspace
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${SPORE_HEALTH_PORT:-18790}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  spore-data:
    driver: local
  spore-workspace:
    driver: local
