<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="30" fill="#2C2416"/>
  
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#D4A843" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Inner decorative ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#D4A843" stroke-width="0.75" opacity="0.4"/>
  
  <!-- Central star -->
  <polygon 
    points="32,12 35.5,24.5 48,24.5 38,32 41.5,44.5 32,36.5 22.5,44.5 26,32 16,24.5 28.5,24.5" 
    fill="#D4A843"
  />
  
  <!-- Small accent dots at cardinal points -->
  <circle cx="32" cy="5" r="2" fill="#D4A843" opacity="0.7"/>
  <circle cx="59" cy="32" r="2" fill="#D4A843" opacity="0.7"/>
  <circle cx="32" cy="59" r="2" fill="#D4A843" opacity="0.7"/>
  <circle cx="5" cy="32" r="2" fill="#D4A843" opacity="0.7"/>
</svg>
