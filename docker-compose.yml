# Builds the shared spore:latest base image from this repo.
# Build context is the repo root so plugins/ (top-level) gets bundled
# alongside src/. See src/Dockerfile for the layer breakdown.
#
# Build:   docker compose build
# Or:      docker build -t spore:latest -f src/Dockerfile .

services:
  spore-build:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: spore:latest
    profiles:
      - build
    command: echo "Image built as spore:latest"
