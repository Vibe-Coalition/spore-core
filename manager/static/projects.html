<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Projects</title>
<script>
(function() {
  var p = location.pathname;
  var base = '/';
  var idx = p.indexOf('/manager');
  if (idx !== -1) base = p.substring(0, idx) + '/manager/';
  var b = document.createElement('base');
  b.href = base;
  document.head.appendChild(b);
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#121212;--surface2:#171717;--border:#262626;--border2:#333;
  --accent:#3b82f6;--accent2:#8b5cf6;--accent3:#f59e0b;--warn:#f59e0b;--danger:#ef4444;
  --text:#ededed;--muted:#737373;--dim:#404040;
  --input-bg:#171717;--input-text:var(--text);
  --font:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',monospace;
  --radius:8px;--success:#22c55e;
}
html{font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent2)}
input,select,textarea{
  background:var(--input-bg);color:var(--input-text);border:1px solid var(--border);
  border-radius:var(--radius);padding:9px 14px;font-family:var(--mono);font-size:.82rem;
  width:100%;outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--border2);box-shadow:0 0 0 1px var(--border2)}
textarea{resize:vertical;min-height:60px}
button{
  background:transparent;color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius);padding:9px 18px;font-family:var(--font);font-size:.82rem;
  cursor:pointer;transition:all .15s;letter-spacing:.02em;
}
button:hover{border-color:var(--border2);background:var(--surface2)}
button.primary{background:#fafafa;color:#0a0a0a;border:none;font-weight:600}
button.primary:hover{background:#e4e4e7}
button.danger{border-color:var(--danger);color:var(--danger)}
button.danger:hover{background:var(--danger);color:#fff}
button.sm{padding:5px 12px;font-size:.75rem}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:52px;border-bottom:1px solid var(--border);
  background:var(--bg);position:sticky;top:0;z-index:100;
}
.topbar h1{font-size:.9rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.topbar .actions{display:flex;gap:8px;align-items:center}

.container{max-width:960px;margin:0 auto;padding:24px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.card h2{font-size:1rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.card h2 .count{font-size:.75rem;color:var(--muted);font-weight:400}

.form-row{display:flex;gap:12px;margin-bottom:12px;align-items:flex-end}
.form-row .field{flex:1}
.form-row .field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.07em;font-family:var(--mono)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-family:var(--mono);padding:8px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.slug{font-family:var(--mono);font-weight:500;color:var(--accent)}
.desc{font-size:.78rem;color:var(--muted)}
.member-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;font-family:var(--mono);background:var(--surface2);border:1px solid var(--border);margin:2px;color:var(--accent2)}
.actions-cell{display:flex;gap:6px;justify-content:flex-end}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem}

.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--radius);font-size:.85rem;z-index:200;transition:all .3s;opacity:0;transform:translateY(10px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--success);color:#000}
.toast.err{background:var(--danger);color:#fff}

#edit-modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#edit-modal.show{display:flex}
#edit-modal .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;width:520px;max-width:90vw}
#edit-modal .modal h3{font-size:1rem;margin-bottom:1rem}
#edit-modal .modal .field{margin-bottom:12px}
#edit-modal .modal .field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.07em;font-family:var(--mono)}
#edit-modal .modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}

.member-select{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);min-height:40px}
.member-select .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:4px;font-size:.75rem;font-family:var(--mono);cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.member-select .chip.selected{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.member-select .chip:hover{border-color:var(--border2)}
</style>
</head>
<body>
<div class="topbar">
  <h1>Shared Project Graphs</h1>
  <div class="actions">
    <a href="./">&#8592; Manager</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2>Create Project</h2>
    <form id="add-form">
      <div class="form-row">
        <div class="field" style="flex:1"><label>Slug (ID)</label><input id="add-slug" placeholder="research-alpha" required pattern="[a-z0-9][a-z0-9_-]*"></div>
        <div class="field" style="flex:2"><label>Name</label><input id="add-name" placeholder="Research Alpha"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Description</label><input id="add-desc" placeholder="Shared knowledge for the research team"></div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Members (click to toggle)</label>
          <div class="member-select" id="add-members"></div>
        </div>
        <div style="flex-shrink:0"><label>&nbsp;</label><button type="submit" class="primary">Create</button></div>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Projects <span class="count" id="proj-count"></span></h2>
    <div id="proj-table"></div>
  </div>
</div>

<div id="edit-modal">
  <div class="modal">
    <h3 id="edit-title">Edit Project</h3>
    <div class="field"><label>Slug</label><input id="edit-slug" readonly></div>
    <div class="field"><label>Name</label><input id="edit-name"></div>
    <div class="field"><label>Description</label><input id="edit-desc"></div>
    <div class="field">
      <label>Members (click to toggle)</label>
      <div class="member-select" id="edit-members"></div>
    </div>
    <div class="btn-row">
      <button onclick="closeEditModal()">Cancel</button>
      <button class="primary" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = (() => {
  const p = location.pathname.replace(/\/projects\.html.*$/, '');
  return p || '';
})();

let CSRF = '';
let allAnimas = [];

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(() => el.className = 'toast', 3000);
}

async function api(path, opts = {}) {
  const fetchOpts = { method: opts.method || 'GET', credentials: 'include', headers: {} };
  if (CSRF) fetchOpts.headers['X-CSRF-Token'] = CSRF;
  if (opts.body && typeof opts.body === 'object') {
    fetchOpts.headers['Content-Type'] = 'application/json';
    fetchOpts.body = JSON.stringify(opts.body);
  }
  const r = await fetch(BASE + path, fetchOpts);
  if (r.status === 401) { location.href = BASE + '/'; return null; }
  return r.json();
}

function renderMemberChips(containerId, selected = []) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  for (const a of allAnimas) {
    const chip = document.createElement('span');
    chip.className = 'chip' + (selected.includes(a.id) ? ' selected' : '');
    chip.textContent = a.name || a.id;
    chip.dataset.id = a.id;
    chip.onclick = () => { chip.classList.toggle('selected'); };
    c.appendChild(chip);
  }
}

function getSelectedMembers(containerId) {
  return [...document.querySelectorAll(`#${containerId} .chip.selected`)].map(c => c.dataset.id);
}

async function loadProjects() {
  const data = await api('/api/projects');
  if (!data) return;
  const projects = data.projects || {};
  const slugs = Object.keys(projects);
  document.getElementById('proj-count').textContent = `(${slugs.length})`;

  if (slugs.length === 0) {
    document.getElementById('proj-table').innerHTML = '<div class="empty">No shared projects yet. Create one above.</div>';
    return;
  }

  let html = '<table><thead><tr><th>Slug</th><th>Name</th><th>Members</th><th>Created</th><th></th></tr></thead><tbody>';
  for (const slug of slugs.sort()) {
    const p = projects[slug];
    const members = (p.members || []).map(m => `<span class="member-badge">${esc(m)}</span>`).join('') || '<span class="desc">none</span>';
    const created = p.created ? new Date(p.created).toLocaleDateString() : '—';
    html += `<tr>
      <td class="slug">${esc(slug)}</td>
      <td>${esc(p.name || slug)}${p.description ? '<br><span class="desc">' + esc(p.description) + '</span>' : ''}</td>
      <td>${members}</td>
      <td class="desc">${created}</td>
      <td><div class="actions-cell">
        <button class="sm" onclick="openEdit('${esc(slug)}')">Edit</button>
        <button class="sm danger" onclick="deleteProject('${esc(slug)}')">Delete</button>
      </div></td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('proj-table').innerHTML = html;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

document.getElementById('add-form').onsubmit = async (e) => {
  e.preventDefault();
  const slug = document.getElementById('add-slug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
  const name = document.getElementById('add-name').value.trim();
  const desc = document.getElementById('add-desc').value.trim();
  const members = getSelectedMembers('add-members');
  if (!slug) { toast('Slug required', false); return; }
  const r = await api('/api/projects', { method: 'POST', body: { slug, name: name || slug, description: desc, members } });
  if (r?.ok) {
    toast('Project created');
    document.getElementById('add-slug').value = '';
    document.getElementById('add-name').value = '';
    document.getElementById('add-desc').value = '';
    renderMemberChips('add-members');
    loadProjects();
  } else {
    toast(r?.error || 'Failed', false);
  }
};

let editSlug = '';
async function openEdit(slug) {
  const data = await api(`/api/projects/${slug}`);
  if (!data?.project) { toast('Not found', false); return; }
  editSlug = slug;
  document.getElementById('edit-slug').value = slug;
  document.getElementById('edit-name').value = data.project.name || '';
  document.getElementById('edit-desc').value = data.project.description || '';
  renderMemberChips('edit-members', data.project.members || []);
  document.getElementById('edit-modal').classList.add('show');
}

function closeEditModal() { document.getElementById('edit-modal').classList.remove('show'); }

async function saveEdit() {
  const name = document.getElementById('edit-name').value.trim();
  const desc = document.getElementById('edit-desc').value.trim();
  const members = getSelectedMembers('edit-members');
  const r = await api(`/api/projects/${editSlug}`, { method: 'PUT', body: { name, description: desc, members } });
  if (r?.ok) {
    toast('Project updated');
    closeEditModal();
    loadProjects();
  } else {
    toast(r?.error || 'Failed', false);
  }
}

async function deleteProject(slug) {
  if (!confirm(`Delete project "${slug}" and its shared graph? This cannot be undone.`)) return;
  const r = await api(`/api/projects/${slug}`, { method: 'DELETE' });
  if (r?.ok) {
    toast('Project deleted');
    loadProjects();
  } else {
    toast(r?.error || 'Failed', false);
  }
}

async function init() {
  try {
    const check = await api('/api/auth/check');
    if (!check?.authenticated) { location.href = BASE + '/'; return; }
    CSRF = check.csrf || '';
    if (check.role !== 'super') { location.href = BASE + '/'; return; }
  } catch { location.href = BASE + '/'; return; }

  try {
    const resp = await api('/api/animas');
    allAnimas = (resp?.animas || []).map(t => ({ id: t.id, name: t.displayName || t.name || t.id }));
  } catch {}

  renderMemberChips('add-members');
  loadProjects();
}

init();
</script>
</body>
</html>
