<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>
<script>
(function() {
  var p = location.pathname;
  var base = '/';
  var idx = p.indexOf('/manager');
  if (idx !== -1) base = p.substring(0, idx) + '/manager/';
  var b = document.createElement('base');
  b.href = base;
  document.head.appendChild(b);
})();
</script>
<script id="brand-loader"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#121212;--surface2:#171717;--border:#262626;--border2:#333;
  --accent:#3b82f6;--accent2:#8b5cf6;--warn:#f59e0b;--danger:#ef4444;
  --text:#ededed;--muted:#737373;--dim:#404040;
  --font:'Geist',system-ui,sans-serif;--mono:'Geist Mono',monospace;
  --radius:8px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font)}

.layout{display:flex;height:100vh;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:48px;border-bottom:1px solid var(--border);
  background:var(--bg);flex-shrink:0;
}
.topbar h1{font-size:.82rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.topbar .back-link{color:var(--muted);font-size:.78rem;text-decoration:none;transition:color .15s}
.topbar .back-link:hover{color:var(--text)}
.topbar .conn-status{font-size:.68rem;color:var(--muted);font-family:var(--mono)}
.topbar .conn-status.connected{color:#22c55e}
.topbar .conn-status.disconnected{color:var(--danger)}

.main{display:flex;flex:1;overflow:hidden}

.sidebar{
  width:220px;flex-shrink:0;border-right:1px solid var(--border);
  background:var(--surface);padding:12px 0;overflow-y:auto;
}
.sidebar h3{
  font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);padding:0 14px;margin:12px 0 6px;font-family:var(--mono);
}
.sidebar h3:first-child{margin-top:0}
.participant{
  display:flex;align-items:center;gap:8px;padding:5px 14px;font-size:.8rem;
}
.participant .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.participant .dot.anima{background:var(--accent2)}
.participant .dot.user{background:#22c55e}
.participant .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chat-area{display:flex;flex-direction:column;flex:1;overflow:hidden}

.messages{
  flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:2px;
}
.msg{display:flex;gap:10px;padding:4px 8px;border-radius:6px;transition:background .1s}
.msg:hover{background:rgba(255,255,255,.02)}
.msg-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.72rem;text-transform:uppercase;
}
.msg-avatar.user-avatar{background:rgba(34,197,94,.15);color:#22c55e}
.msg-avatar.anima-avatar{background:rgba(139,92,246,.15);color:var(--accent2)}
.msg-body{flex:1;min-width:0}
.msg-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.msg-author{font-weight:600;font-size:.82rem}
.msg-author.anima{color:var(--accent2)}
.msg-author.user{color:#22c55e}
.msg-time{font-size:.62rem;color:var(--dim);font-family:var(--mono)}
.msg-content{font-size:.85rem;line-height:1.55;word-break:break-word;color:var(--text)}
.msg-content p{margin:0 0 6px}
.msg-content p:last-child{margin-bottom:0}
.msg-content pre{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:6px 0;font-size:.78rem}
.msg-content code{font-family:var(--mono);font-size:.82em;background:var(--surface2);padding:1px 5px;border-radius:3px}
.msg-content pre code{background:none;padding:0}
.msg-content img{max-width:400px;max-height:300px;border-radius:6px;margin:4px 0;cursor:pointer}
.msg-content video,.msg-content audio{max-width:400px;margin:4px 0;border-radius:6px}
.msg-content a{color:var(--accent);text-decoration:underline}
.msg-content blockquote{border-left:3px solid var(--border2);padding-left:10px;color:var(--muted);margin:6px 0}
.msg-content ul,.msg-content ol{padding-left:1.5em;margin:4px 0}
.msg-media{margin-top:6px}

.typing-indicator{
  padding:4px 8px;font-size:.72rem;color:var(--muted);font-style:italic;
  min-height:20px;
}
.typing-indicator strong{color:var(--accent,#4fc3f7);font-weight:600;font-style:normal;}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.typing-indicator:not(:empty){animation:pulse 2s ease-in-out infinite;}

.input-bar{
  padding:12px 20px;border-top:1px solid var(--border);background:var(--surface);
  display:flex;gap:10px;align-items:flex-end;flex-shrink:0;
}
.input-bar textarea{
  flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 14px;font-family:var(--font);font-size:.85rem;
  resize:none;max-height:120px;min-height:40px;line-height:1.4;outline:none;
}
.input-bar textarea:focus{border-color:var(--border2)}
.input-bar textarea::placeholder{color:var(--dim)}
.input-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  border-radius:var(--radius);width:38px;height:38px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;
}
.input-btn:hover{border-color:var(--border2);color:var(--text)}
.input-btn.send{background:var(--accent);border-color:var(--accent);color:#fff}
.input-btn.send:hover{opacity:.85}

.mention-popup{
  position:absolute;bottom:100%;left:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:4px 0;max-height:180px;overflow-y:auto;
  box-shadow:0 -4px 20px rgba(0,0,0,.4);display:none;min-width:180px;z-index:50;
}
.mention-popup.visible{display:block}
.mention-item{
  padding:6px 14px;font-size:.8rem;cursor:pointer;transition:background .1s;
}
.mention-item:hover,.mention-item.active{background:rgba(255,255,255,.06)}
.mention-item .mi-type{font-size:.6rem;color:var(--dim);margin-left:6px;font-family:var(--mono);text-transform:uppercase}

.system-msg{
  text-align:center;color:var(--dim);font-size:.72rem;padding:8px;font-family:var(--mono);
}

@media(max-width:768px){
  .sidebar{display:none}
  .messages{padding:10px}
  .input-bar{padding:8px 10px}
}
</style>
</head>
<body>
<div class="layout">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:16px">
      <a href="./" class="back-link">&larr; Dashboard</a>
      <h1 id="room-title">Chat Room</h1>
    </div>
    <span class="conn-status disconnected" id="conn-status">Disconnected</span>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar">
      <h3>Online</h3>
      <div id="participants"></div>
    </div>
    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typing-indicator"></div>
      <div class="input-bar" style="position:relative">
        <div class="mention-popup" id="mention-popup"></div>
        <button class="input-btn" id="upload-btn" title="Upload file">&#128206;</button>
        <textarea id="msg-input" placeholder="Type a message... Use @name to mention" rows="1"></textarea>
        <button class="input-btn send" id="send-btn" title="Send">&#9654;</button>
        <input type="file" id="file-input" style="display:none" accept="image/*,video/*,audio/*,.pdf,.txt,.json,.js,.py,.html,.css">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-sql.min.js"></script>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const uploadBtn = document.getElementById('upload-btn');
const fileInput = document.getElementById('file-input');
const typingEl = document.getElementById('typing-indicator');
const connEl = document.getElementById('conn-status');
const participantsEl = document.getElementById('participants');
const mentionPopup = document.getElementById('mention-popup');

let ws = null;
let currentUser = null;
let csrf = null;
const participants = new Map();
const typingTimers = new Map();
let mentionActive = false;
let mentionItems = [];
let mentionIdx = 0;

// Derive base path from current page location (e.g. "/manager" when behind Traefik)
const BASE = location.pathname.replace(/\/[^/]*$/, '');

marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    if (Prism.languages[lang]) return Prism.highlight(code, Prism.languages[lang], lang);
    return code;
  }
});

async function init() {
  const resp = await fetch(BASE + '/api/auth/check');
  const data = await resp.json();
  if (!data.authenticated) {
    window.location.href = BASE + '/?returnTo=' + encodeURIComponent(window.location.href);
    return;
  }
  currentUser = data.username;
  csrf = data.csrf;
  connectWS();
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}${BASE}/ws/chatroom`);

  ws.onopen = () => {
    connEl.textContent = 'Connected';
    connEl.className = 'conn-status connected';
  };

  ws.onclose = () => {
    connEl.textContent = 'Disconnected';
    connEl.className = 'conn-status disconnected';
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {};

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch {}
  };
}

function handleMessage(msg) {
  if (msg.type === 'history') {
    messagesEl.innerHTML = '';
    for (const m of msg.messages) appendMessage(m);
    scrollToBottom();
    return;
  }

  if (msg.type === 'chat') {
    appendMessage(msg);
    scrollToBottom();
    clearTyping(msg.authorId);
    clearWorking(msg.authorName);
    return;
  }

  if (msg.type === 'presence') {
    participants.set(msg.id, { name: msg.name, type: msg.authorType });
    renderParticipants();
    return;
  }

  if (msg.type === 'leave') {
    participants.delete(msg.id);
    renderParticipants();
    return;
  }

  if (msg.type === 'typing') {
    showTyping(msg.authorName);
    return;
  }

  if (msg.type === 'status') {
    if (msg.status) {
      setWorking(msg.authorName, msg.status);
    } else {
      clearWorking(msg.authorName);
    }
    return;
  }
}

function renderParticipants() {
  const animas = [];
  const users = [];
  for (const [id, p] of participants) {
    if (p.type === 'anima') animas.push(p);
    else users.push(p);
  }
  let html = '';
  if (animas.length) {
    html += '<h3>Animas</h3>';
    for (const a of animas) html += `<div class="participant"><div class="dot anima"></div><div class="name">${esc(a.name)}</div></div>`;
  }
  if (users.length) {
    html += '<h3>Users</h3>';
    for (const u of users) html += `<div class="participant"><div class="dot user"></div><div class="name">${esc(u.name)}</div></div>`;
  }
  participantsEl.innerHTML = html;
}

function appendMessage(m) {
  const isAnima = m.authorType === 'anima';
  const div = document.createElement('div');
  div.className = 'msg';
  div.dataset.id = m.id;

  const initials = (m.authorName || '?').substring(0, 2).toUpperCase();
  const avatarClass = isAnima ? 'anima-avatar' : 'user-avatar';
  const authorClass = isAnima ? 'anima' : 'user';

  const time = m.createdAt ? new Date(m.createdAt + 'Z').toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';

  let contentHtml = renderMarkdown(m.content || '');
  contentHtml = renderMedia(contentHtml, m.mediaUrl, m.mediaType);

  div.innerHTML = `
    <div class="msg-avatar ${avatarClass}">${initials}</div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-author ${authorClass}">${esc(m.authorName)}</span>
        <span class="msg-time">${time}</span>
      </div>
      <div class="msg-content">${contentHtml}</div>
    </div>
  `;
  messagesEl.appendChild(div);
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = marked.parse(text);
  html = DOMPurify.sanitize(html, {
    ALLOWED_TAGS: ['p','br','strong','em','code','pre','a','img','video','audio','source',
      'ul','ol','li','blockquote','h1','h2','h3','h4','h5','h6','table','thead','tbody',
      'tr','th','td','span','div','hr','del','sup','sub'],
    ALLOWED_ATTR: ['href','src','alt','title','class','controls','autoplay','loop','muted',
      'width','height','target','rel','type'],
    ADD_ATTR: ['target'],
  });
  html = autoRenderMedia(html);
  return html;
}

function autoRenderMedia(html) {
  html = html.replace(
    /(?<!\")(?:https?:\/\/[^\s<"]+\.(?:png|jpg|jpeg|gif|webp|svg))(?!\")/gi,
    (url) => `<img src="${esc(url)}" alt="image" loading="lazy" onclick="window.open('${esc(url)}')">`
  );
  html = html.replace(
    /(?<!\")(?:https?:\/\/[^\s<"]+\.(?:mp4|webm))(?!\")/gi,
    (url) => `<video controls preload="metadata"><source src="${esc(url)}"></video>`
  );
  html = html.replace(
    /(?<!\")(?:https?:\/\/[^\s<"]+\.(?:mp3|ogg|wav))(?!\")/gi,
    (url) => `<audio controls preload="metadata"><source src="${esc(url)}"></audio>`
  );
  return html;
}

function renderMedia(html, mediaUrl, mediaType) {
  if (!mediaUrl) return html;
  const mt = (mediaType || '').split('/')[0];
  if (mt === 'image') html += `<div class="msg-media"><img src="${esc(mediaUrl)}" alt="upload" loading="lazy" onclick="window.open('${esc(mediaUrl)}')"></div>`;
  else if (mt === 'video') html += `<div class="msg-media"><video controls preload="metadata"><source src="${esc(mediaUrl)}"></video></div>`;
  else if (mt === 'audio') html += `<div class="msg-media"><audio controls><source src="${esc(mediaUrl)}"></audio></div>`;
  else html += `<div class="msg-media"><a href="${esc(mediaUrl)}" target="_blank">📎 ${esc(mediaUrl.split('/').pop())}</a></div>`;
  return html;
}

function scrollToBottom() {
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

const workingStatus = new Map();

function showTyping(name) {
  if (typingTimers.has(name)) clearTimeout(typingTimers.get(name));
  typingTimers.set(name, setTimeout(() => { typingTimers.delete(name); updateTypingDisplay(); }, 6000));
  updateTypingDisplay();
}

function clearTyping(authorId) {
  for (const [name, _] of typingTimers) {
    const p = [...participants.values()].find(p => p.name === name);
    if (p) { typingTimers.delete(name); }
  }
  updateTypingDisplay();
}

function setWorking(name, status) {
  workingStatus.set(name, status);
  updateTypingDisplay();
}

function clearWorking(name) {
  workingStatus.delete(name);
  updateTypingDisplay();
}

function updateTypingDisplay() {
  const parts = [];
  for (const [name, status] of workingStatus) {
    const label = status === 'thinking' ? 'thinking' : status === 'working' ? 'working' : status;
    parts.push(`<strong>${esc(name)}</strong> is ${esc(label)}…`);
  }
  const typingOnly = [...typingTimers.keys()].filter(n => !workingStatus.has(n));
  if (typingOnly.length === 1) parts.push(`${esc(typingOnly[0])} is typing…`);
  else if (typingOnly.length > 1) parts.push(`${typingOnly.length} others typing…`);

  typingEl.innerHTML = parts.join(' &nbsp;·&nbsp; ') || '';
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'chat', content: text }));
  inputEl.value = '';
  inputEl.style.height = 'auto';
  hideMentionPopup();
}

let _typingThrottle = 0;
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';

  if (ws?.readyState === WebSocket.OPEN && Date.now() - _typingThrottle > 3000) {
    ws.send(JSON.stringify({ type: 'typing' }));
    _typingThrottle = Date.now();
  }

  checkMention();
});

inputEl.addEventListener('keydown', (e) => {
  if (mentionActive) {
    if (e.key === 'ArrowDown') { e.preventDefault(); mentionIdx = Math.min(mentionIdx + 1, mentionItems.length - 1); renderMentionPopup(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); mentionIdx = Math.max(mentionIdx - 1, 0); renderMentionPopup(); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); selectMention(); return; }
    if (e.key === 'Escape') { hideMentionPopup(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

sendBtn.addEventListener('click', sendMessage);
uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  try {
    const resp = await fetch(BASE + '/api/chatroom/upload', {
      method: 'POST',
      headers: { 'x-csrf-token': csrf, 'x-filename': file.name },
      body: file,
    });
    const data = await resp.json();
    if (data.url) {
      ws.send(JSON.stringify({ type: 'chat', content: file.name, mediaUrl: BASE + data.url, mediaType: file.type }));
    }
  } catch (e) {
    console.error('Upload failed:', e);
  }
  fileInput.value = '';
});

// Drag and drop
const chatArea = document.querySelector('.chat-area');
chatArea.addEventListener('dragover', (e) => { e.preventDefault(); chatArea.style.outline = '2px dashed var(--accent)'; });
chatArea.addEventListener('dragleave', () => { chatArea.style.outline = ''; });
chatArea.addEventListener('drop', async (e) => {
  e.preventDefault();
  chatArea.style.outline = '';
  const file = e.dataTransfer?.files[0];
  if (!file) return;
  try {
    const resp = await fetch(BASE + '/api/chatroom/upload', {
      method: 'POST',
      headers: { 'x-csrf-token': csrf, 'x-filename': file.name },
      body: file,
    });
    const data = await resp.json();
    if (data.url) {
      ws.send(JSON.stringify({ type: 'chat', content: file.name, mediaUrl: BASE + data.url, mediaType: file.type }));
    }
  } catch {}
});

// @mention autocomplete
function checkMention() {
  const val = inputEl.value;
  const cursor = inputEl.selectionStart;
  const before = val.substring(0, cursor);
  const match = before.match(/@(\w*)$/);
  if (!match) { hideMentionPopup(); return; }
  const query = match[1].toLowerCase();
  mentionItems = [...participants.values()]
    .filter(p => p.name.toLowerCase().includes(query))
    .slice(0, 8);
  if (mentionItems.length === 0) { hideMentionPopup(); return; }
  mentionIdx = 0;
  mentionActive = true;
  renderMentionPopup();
}

function renderMentionPopup() {
  mentionPopup.innerHTML = mentionItems.map((item, i) =>
    `<div class="mention-item${i === mentionIdx ? ' active' : ''}" data-name="${esc(item.name)}" onmousedown="selectMentionByName('${esc(item.name)}')">${esc(item.name)}<span class="mi-type">${item.type}</span></div>`
  ).join('');
  mentionPopup.classList.add('visible');
}

function selectMention() {
  if (mentionItems[mentionIdx]) selectMentionByName(mentionItems[mentionIdx].name);
}

window.selectMentionByName = function(name) {
  const val = inputEl.value;
  const cursor = inputEl.selectionStart;
  const before = val.substring(0, cursor);
  const after = val.substring(cursor);
  const newBefore = before.replace(/@\w*$/, `@${name} `);
  inputEl.value = newBefore + after;
  inputEl.selectionStart = inputEl.selectionEnd = newBefore.length;
  hideMentionPopup();
  inputEl.focus();
};

function hideMentionPopup() {
  mentionActive = false;
  mentionPopup.classList.remove('visible');
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
