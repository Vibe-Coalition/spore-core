<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credential Vault</title>
<script>
(function() {
  var p = location.pathname;
  var base = '/';
  var idx = p.indexOf('/manager');
  if (idx !== -1) base = p.substring(0, idx) + '/manager/';
  var b = document.createElement('base');
  b.href = base;
  document.head.appendChild(b);
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#121212;--surface2:#171717;--border:#262626;--border2:#333;
  --accent:#3b82f6;--accent2:#8b5cf6;--accent3:#f59e0b;--warn:#f59e0b;--danger:#ef4444;
  --text:#ededed;--muted:#737373;--dim:#404040;
  --input-bg:#171717;--input-text:var(--text);
  --font:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',monospace;
  --radius:8px;--success:#22c55e;
}
html{font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent2)}
input,select,textarea{
  background:var(--input-bg);color:var(--input-text);border:1px solid var(--border);
  border-radius:var(--radius);padding:9px 14px;font-family:var(--mono);font-size:.82rem;
  width:100%;outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--border2);box-shadow:0 0 0 1px var(--border2)}
textarea{resize:vertical;min-height:60px}
button{
  background:transparent;color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius);padding:9px 18px;font-family:var(--font);font-size:.82rem;
  cursor:pointer;transition:all .15s;letter-spacing:.02em;
}
button:hover{border-color:var(--border2);background:var(--surface2)}
button.primary{background:#fafafa;color:#0a0a0a;border:none;font-weight:600}
button.primary:hover{background:#e4e4e7}
button.danger{border-color:var(--danger);color:var(--danger)}
button.danger:hover{background:var(--danger);color:#fff}
button.sm{padding:5px 12px;font-size:.75rem}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:52px;border-bottom:1px solid var(--border);
  background:var(--bg);position:sticky;top:0;z-index:100;
}
.topbar h1{font-size:.9rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.topbar .actions{display:flex;gap:8px;align-items:center}

.container{max-width:960px;margin:0 auto;padding:24px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.card h2{font-size:1rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.card h2 .count{font-size:.75rem;color:var(--muted);font-weight:400}

.form-row{display:flex;gap:12px;margin-bottom:12px;align-items:flex-end}
.form-row .field{flex:1}
.form-row .field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.07em;font-family:var(--mono)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-family:var(--mono);padding:8px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.key-name{font-family:var(--mono);font-weight:500;color:var(--accent)}
.key-value{font-family:var(--mono);color:var(--muted);font-size:.8rem}
.scope-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;font-family:var(--mono);background:var(--surface2);border:1px solid var(--border)}
.scope-badge.global{color:var(--success);border-color:rgba(34,197,94,0.3)}
.scope-badge.scoped{color:var(--accent3);border-color:rgba(245,158,11,0.3)}
.actions-cell{display:flex;gap:6px;justify-content:flex-end}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--radius);font-size:.85rem;z-index:200;transition:all .3s;opacity:0;transform:translateY(10px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--success);color:#000}
.toast.err{background:var(--danger);color:#fff}
.desc{font-size:.78rem;color:var(--muted)}

.log-list{max-height:300px;overflow-y:auto}
.log-entry{display:flex;gap:12px;padding:6px 0;font-size:.78rem;border-bottom:1px solid var(--border);font-family:var(--mono)}
.log-entry .log-time{color:var(--muted);white-space:nowrap;min-width:140px}
.log-entry .log-action{font-weight:500;min-width:50px}
.log-entry .log-action.set{color:var(--success)}
.log-entry .log-action.read,.log-entry .log-action.fetch{color:var(--accent)}
.log-entry .log-action.delete,.log-entry .log-action.denied{color:var(--danger)}
.log-entry .log-action.proxy{color:var(--accent2)}
.log-key{color:var(--accent3)}

#edit-modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#edit-modal.show{display:flex}
#edit-modal .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;width:480px;max-width:90vw}
#edit-modal .modal h3{font-size:1rem;margin-bottom:1rem}
#edit-modal .modal .field{margin-bottom:12px}
#edit-modal .modal .field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.07em;font-family:var(--mono)}
#edit-modal .modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
</style>
</head>
<body>
<div class="topbar">
  <h1>Credential Vault</h1>
  <div class="actions">
    <a href="./">&#8592; Manager</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2>Add Key</h2>
    <form id="add-form">
      <div class="form-row">
        <div class="field" style="flex:2"><label>Key Name</label><input id="add-name" placeholder="MY_API_KEY" required pattern="[A-Za-z_][A-Za-z0-9_]*"></div>
        <div class="field" style="flex:3"><label>Value</label><input id="add-value" type="password" placeholder="sk-..." required></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Scope</label><input id="add-scope" placeholder="global (or comma-separated anima names)" value="global"></div>
        <div class="field"><label>Description</label><input id="add-desc" placeholder="Optional description"></div>
        <div style="flex-shrink:0"><label>&nbsp;</label><button type="submit" class="primary">Add Key</button></div>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Stored Keys <span class="count" id="key-count"></span></h2>
    <div id="keys-table"></div>
  </div>

  <div class="card">
    <h2>Audit Log</h2>
    <div class="log-list" id="log-list"></div>
  </div>
</div>

<div id="edit-modal">
  <div class="modal">
    <h3 id="edit-title">Edit Key</h3>
    <div class="field"><label>Key Name</label><input id="edit-name" readonly></div>
    <div class="field"><label>New Value (leave blank to keep current)</label><input id="edit-value" type="password" placeholder="Leave blank to keep current value"></div>
    <div class="field"><label>Scope</label><input id="edit-scope"></div>
    <div class="field"><label>Description</label><input id="edit-desc"></div>
    <div class="btn-row">
      <button onclick="closeEditModal()">Cancel</button>
      <button class="primary" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = (() => {
  const scripts = document.getElementsByTagName('script');
  for (const s of scripts) {
    if (s.src && s.src.includes('vault')) return new URL('.', s.src).pathname.replace(/\/$/, '');
  }
  const p = location.pathname.replace(/\/vault\.html.*$/, '');
  return p || '';
})();

function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 3000);
}

async function api(path, opts = {}) {
  const res = await fetch(BASE + path, { credentials: 'include', ...opts });
  if (res.status === 401) { location.href = BASE + '/'; return null; }
  return res.json();
}

async function loadKeys() {
  const data = await api('/api/vault/keys');
  if (!data) return;
  const el = document.getElementById('keys-table');
  document.getElementById('key-count').textContent = `(${data.keys.length})`;
  if (!data.keys.length) { el.innerHTML = '<div class="empty">No keys stored yet. Add one above.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>Name</th><th>Scope</th><th>Description</th><th>Updated</th><th></th></tr></thead><tbody>${
    data.keys.map(k => `<tr>
      <td class="key-name">${esc(k.name)}</td>
      <td><span class="scope-badge ${k.scope === 'global' ? 'global' : 'scoped'}">${esc(k.scope)}</span></td>
      <td class="desc">${esc(k.description || '—')}</td>
      <td class="desc">${k.updatedAt?.replace('T', ' ').slice(0, 16) || '—'}</td>
      <td><div class="actions-cell">
        <button class="sm" onclick="editKey('${esc(k.name)}', '${esc(k.scope)}', '${esc(k.description || '')}')">Edit</button>
        <button class="sm danger" onclick="deleteKey('${esc(k.name)}')">Delete</button>
      </div></td>
    </tr>`).join('')
  }</tbody></table>`;
}

async function loadLog() {
  const data = await api('/api/vault/log');
  if (!data) return;
  const el = document.getElementById('log-list');
  if (!data.entries.length) { el.innerHTML = '<div class="empty">No activity yet.</div>'; return; }
  el.innerHTML = data.entries.map(e => `<div class="log-entry">
    <span class="log-time">${e.createdAt?.replace('T', ' ') || '—'}</span>
    <span class="log-action ${e.action}">${e.action}</span>
    <span class="log-key">${esc(e.keyName)}</span>
    <span style="color:var(--muted)">${esc(e.actor)} (${e.actorType})</span>
  </div>`).join('');
}

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

document.getElementById('add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('add-name').value.trim();
  const value = document.getElementById('add-value').value;
  const scope = document.getElementById('add-scope').value.trim() || 'global';
  const description = document.getElementById('add-desc').value.trim();
  if (!name || !value) return;
  const data = await api('/api/vault/keys', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, value, scope, description }),
  });
  if (data?.ok) {
    toast(`Key "${name}" saved`);
    document.getElementById('add-name').value = '';
    document.getElementById('add-value').value = '';
    document.getElementById('add-desc').value = '';
    loadKeys(); loadLog();
  } else {
    toast(data?.error || 'Failed', false);
  }
});

async function deleteKey(name) {
  if (!confirm(`Delete key "${name}"? This cannot be undone.`)) return;
  const data = await api(`/api/vault/keys/${encodeURIComponent(name)}`, { method: 'DELETE' });
  if (data?.ok) { toast(`Key "${name}" deleted`); loadKeys(); loadLog(); }
  else toast(data?.error || 'Failed', false);
}

let _editOriginal = null;
function editKey(name, scope, desc) {
  _editOriginal = { name, scope, desc };
  document.getElementById('edit-name').value = name;
  document.getElementById('edit-value').value = '';
  document.getElementById('edit-scope').value = scope;
  document.getElementById('edit-desc').value = desc;
  document.getElementById('edit-title').textContent = `Edit: ${name}`;
  document.getElementById('edit-modal').classList.add('show');
}
function closeEditModal() { document.getElementById('edit-modal').classList.remove('show'); }
async function saveEdit() {
  const name = document.getElementById('edit-name').value;
  const value = document.getElementById('edit-value').value;
  const scope = document.getElementById('edit-scope').value.trim() || 'global';
  const description = document.getElementById('edit-desc').value.trim();
  if (!value && scope === _editOriginal?.scope && description === (_editOriginal?.desc || '')) {
    closeEditModal(); return;
  }
  const body = { name, scope, description };
  if (value) body.value = value; else {
    // Need to re-fetch the original value to preserve it — we do a full update
    toast('Value required to update key', false); return;
  }
  const data = await api('/api/vault/keys', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (data?.ok) { toast(`Key "${name}" updated`); closeEditModal(); loadKeys(); loadLog(); }
  else toast(data?.error || 'Failed', false);
}

document.getElementById('edit-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('edit-modal')) closeEditModal();
});

loadKeys();
loadLog();
setInterval(() => { loadKeys(); loadLog(); }, 30000);
</script>
</body>
</html>
