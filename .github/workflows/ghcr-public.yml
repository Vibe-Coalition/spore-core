name: Make GHCR package public

on:
  workflow_dispatch:

jobs:
  visibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          gh api \
            --method PATCH \
            "/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/visibility" \
            -f visibility=public
